  <title>学習ヘルパー — 挑戦様のホーム</title>
  <!-- 수정: assets 폴더가 최상위에 있다고 가정 -->
  <link rel="stylesheet" href="assets/style.css">
  <style>
    @page { size: 1280px 1600px; margin: 0; }
    body { width: 100%; max-width: 1280px; margin: 0 auto; }
    .page { width: 100%; max-width: 1280px; min-height: 1600px; position: relative; }
    .main-content { padding: 0 80px; }
    .topbar { padding: 0 80px; }
    .quick-card { background: var(--white); border: 1px solid var(--neutral-200); border-radius: var(--r-md); padding: 20px; text-align: center; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; text-decoration: none; color: inherit; display: block; }
    .quick-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
    .quick-card .ico { width: 56px; height: 56px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 12px; }
    .feed-row { display: flex; gap: 12px; padding: 12px; align-items: center; border-bottom: 1px solid var(--neutral-200); transition: background 0.15s; }
    .feed-row:last-child { border-bottom: 0; }
    .feed-row:hover { background: var(--neutral-50); }
    .ad-slot { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 90px; padding: 16px 24px; background: var(--neutral-50); border: 1px dashed var(--neutral-300); border-radius: var(--r-md); }
    .ad-slot .ad-chip { position: absolute; top: 10px; left: 12px; padding: 2px 8px; background: var(--neutral-200); color: var(--neutral-500); font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; border-radius: var(--r-sm); }
    .ad-slot .ad-body { flex: 1; text-align: center; color: var(--neutral-400); }
    .ad-slot .ad-body .ad-title { font-size: 15px; font-weight: 600; }
    .ad-slot .ad-body .ad-spec { font-size: 11px; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
    .ad-slot .ad-upsell { flex-shrink: 0; color: var(--orange); font-weight: 600; font-size: 12px; text-decoration: none; }
    .topbar-right .user-chip { transition: background 0.15s; }
    .topbar-right .user-chip:hover { background: var(--neutral-50); }
    .profile-menu-item:hover { background: var(--neutral-50); }
    .profile-logout:hover { background: var(--red-soft); }
  </style>
</head>
