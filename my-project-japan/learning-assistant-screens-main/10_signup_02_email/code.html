<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>会員登録 - メールアドレス入力 — 学習サポーター</title><link rel="stylesheet" href="../assets/style.css">
<style>
  @page { size: 1280px 900px; margin: 0; }
  body { width: 100%; max-width: 1280px; margin: 0 auto; }
  .page { width: 100%; max-width: 1280px; min-height: 900px; position: relative; background: var(--neutral-50); }
  .signup-shell { display: flex; align-items: center; justify-content: center; min-height: 800px; padding: 40px; }
  .signup-card { background: var(--white); border-radius: var(--r-lg); padding: 56px; max-width: 480px; width: 100%; border: 1px solid var(--neutral-200); position: relative; }
  .stepper { display: flex; gap: 8px; align-items: center; margin-bottom: 24px; }
  .step-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--neutral-200); }
  .step-dot.active { background: var(--orange); }
  .step-dot.done { background: var(--green); }
  .step-line { flex: 1; height: 2px; background: var(--neutral-200); }
  .step-line.done { background: var(--orange); }
  .input-field { display: block; width: 100%; padding: 14px 16px; border: 1.5px solid var(--neutral-200); border-radius: var(--r-md); font-size: 14px; background: var(--white); margin-bottom: 6px; }
  .input-field.focus { border-color: var(--orange); }
  .helper { font-size: 12px; color: var(--neutral-500); }
  .helper.ok { color: var(--green); }
  .helper.error { color: var(--red); }
  .pw-strength { display: flex; gap: 4px; margin-top: 6px; height: 4px; }
  .pw-strength span { flex: 1; border-radius: 2px; background: var(--neutral-200); }
  .pw-strength.medium span:nth-child(-n+2) { background: var(--amber); }
  @media screen {
    .page { min-height: 100vh; display: flex; flex-direction: column; }
    .signup-shell { flex: 1; min-height: 0; padding: 24px; }
  }
</style></head>
<body>
<div class="page">
  <div class="signup-shell">
    <div class="signup-card">
      <a href="../01_main/code.html" style="position:absolute; top:18px; right:20px; text-decoration:none; color:var(--neutral-400); font-size:20px; line-height:1;">✕</a>
      <div class="stepper">
        <div class="step-dot done"></div><div class="step-line done"></div>
        <div class="step-dot active"></div><div class="step-line"></div>
        <div class="step-dot"></div><div class="step-line"></div>
        <div class="step-dot"></div><div class="step-line"></div>
        <div class="step-dot"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--neutral-500); margin-bottom: 32px; font-family: 'JetBrains Mono', monospace;">
        <span>登録方法</span><span style="color: var(--orange); font-weight: 700;">アカウント</span><span>利用規約</span><span>認証</span><span>プロフィール</span>
      </div>

      <h1 style="font-size: 26px; font-weight: 700; color: var(--neutral-900); margin-bottom: 24px;">アカウント情報を入力してください</h1>

      <div style="margin-bottom: 20px;">
        <label style="font-size: 13px; font-weight: 600; color: var(--neutral-700); margin-bottom: 6px; display: block;">メールアドレス</label>
        <input class="input-field focus" value="[email protected]" readonly>
        <div class="helper ok">✓ 利用可能なメールアドレスです</div>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="font-size: 13px; font-weight: 600; color: var(--neutral-700); margin-bottom: 6px; display: block;">パスワード</label>
        <input class="input-field" type="password" value="••••••••" readonly>
        <div class="pw-strength medium"><span></span><span></span><span></span><span></span></div>
        <div class="helper" style="margin-top: 6px;">8〜20文字 · 英数字·記号の組み合わせを推奨</div>
      </div>

      <div style="margin-bottom: 32px;">
        <label style="font-size: 13px; font-weight: 600; color: var(--neutral-700); margin-bottom: 6px; display: block;">パスワード確認</label>
        <input class="input-field" type="password" value="••••••••" readonly>
        <div class="helper ok">✓ パスワードが一致しました</div>
      </div>

      <div style="display:flex; gap:12px;">
        <a href="../09_signup_01_method/code.html" style="flex:0 0 120px; display:flex; align-items:center; justify-content:center; height:52px; border-radius:var(--r-md); background:var(--white); color:var(--neutral-700); border:1.5px solid var(--neutral-300); font-weight:600; font-size:14px; text-decoration:none;">← 戻る</a>
        <a href="../11_signup_03_terms/code.html" style="flex:1; display:flex; align-items:center; justify-content:center; height:52px; border-radius:var(--r-md); background:var(--orange); color:var(--white); font-weight:700; font-size:15px; text-decoration:none;">次のステップへ →</a>
      </div>

      <div style="text-align: center; margin-top: 16px; font-size: 12px; color: var(--neutral-400);">
        🔒 HTTPS暗号化通信 · パスワードはクライアント側で平文保存されません
      </div>
    </div>
  </div>

  <div class="screen-id">P-FE-SU-05 · /auth/signup/email</div>
</div>
</body></html>
