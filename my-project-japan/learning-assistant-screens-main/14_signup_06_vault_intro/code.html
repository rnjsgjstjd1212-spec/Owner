<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>会員登録 - 黒歴史封印所の案内 — 学習サポーター</title><link rel="stylesheet" href="../assets/style.css">
<style>
  @page { size: 1280px 900px; margin: 0; }
  body { width: 100%; max-width: 1280px; margin: 0 auto; }
  .page { width: 100%; max-width: 1280px; min-height: 900px; position: relative; background: var(--neutral-50); }
  .signup-shell { display: flex; align-items: center; justify-content: center; min-height: 800px; padding: 40px; }
  .signup-card { background: var(--white); border-radius: var(--r-lg); padding: 56px; max-width: 520px; width: 100%; border: 1px solid var(--neutral-200); text-align: center; position: relative; }
  @media screen {
    .page { min-height: 100vh; display: flex; flex-direction: column; }
    .signup-shell { flex: 1; min-height: 0; padding: 24px; }
  }
</style></head>
<body>
<div class="page">
  <div class="signup-shell">
    <div class="signup-card">
      <a href="../01_main/code.html" style="position:absolute; top:18px; right:20px; text-decoration:none; color:var(--neutral-400); font-size:20px; line-height:1;">✕</a>
      <div style="text-align: center; font-size: 12px; font-weight: 500; color: var(--neutral-400); margin-bottom: 20px; letter-spacing: 0.02em;">選択段階 (Optional) — 登録には影響ありません</div>
      <div style="width: 96px; height: 96px; border-radius: 50%; background: var(--orange-soft); display: inline-flex; align-items: center; justify-content: center; font-size: 48px; margin-bottom: 24px; border: 3px solid var(--orange);">🔒</div>

      <h1 style="font-size: 26px; font-weight: 700; color: var(--neutral-900); margin-bottom: 12px;">黒歴史封印所の設定</h1>
      <p style="font-size: 14px; color: var(--neutral-500); line-height: 1.6; margin-bottom: 28px;">
        学習目標を達成できなかった場合に<br>公開されるあなたの黒歴史ファイルを事前登録します。
      </p>

      <div style="background: #FEF3C7; border-left: 4px solid var(--amber); padding: 16px 20px; border-radius: var(--r-sm); margin-bottom: 28px; text-align: left;">
        <div style="font-weight: 700; font-size: 13px; color: #92400E; margin-bottom: 8px;">⚠️ 登録した黒歴史は</div>
        <ul style="font-size: 12px; color: #92400E; line-height: 1.7; padding-left: 16px; margin: 0;">
          <li>目標達成失敗時、24時間後に公開掲示板へ自動投稿</li>
          <li>安全モニタリングを経て、不適切なコンテンツは自動拒否</li>
          <li>マイページにていつでも交換・削除可能</li>
        </ul>
      </div>

      <div style="display: flex; gap: 12px;">
        <a href="../16_signup_08_complete/code.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: var(--r-md); background: var(--white); color: var(--neutral-700); border: 1.5px solid var(--neutral-300); font-weight: 600; font-size: 14px; text-decoration: none;">
          後で登録する
        </a>
        <a href="../15_signup_07_vault_upload/code.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: var(--r-md); background: var(--orange); color: var(--white); font-weight: 700; font-size: 14px; text-decoration: none;">
          🔒 今すぐ登録する
        </a>
      </div>

      <div style="background: var(--info-soft); padding: 12px; border-radius: var(--r-sm); margin-top: 20px; font-size: 12px; color: #1E40AF; line-height: 1.5;">
        💡 登録後もマイページ &gt; 黒歴史封印所からいつでも登録可能です
      </div>
    </div>
  </div>

  <div class="screen-id">P-FE-SU-25 · /auth/signup/vault-intro</div>
</div>
</body></html>
