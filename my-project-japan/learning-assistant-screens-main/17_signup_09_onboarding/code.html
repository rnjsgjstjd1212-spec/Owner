<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>オンボーディング - 学習サポーターの使い方 — 学習サポーター</title><link rel="stylesheet" href="../assets/style.css">
<style>
  @page { size: 1280px 900px; margin: 0; }
  body { width: 100%; max-width: 1280px; margin: 0 auto; }
  .page { width: 100%; max-width: 1280px; min-height: 900px; position: relative; background: var(--neutral-50); }
  .ob-shell { display: flex; align-items: center; justify-content: center; min-height: 900px; padding: 40px; }
  .ob-card { background: var(--white); border-radius: var(--r-lg); padding: 56px; max-width: 720px; width: 100%; border: 1px solid var(--neutral-200); }
  @media screen {
    .page { min-height: 100vh; display: flex; flex-direction: column; }
    .ob-shell { flex: 1; min-height: 0; padding: 24px; }
  }
</style></head>
<body>
<div class="page">
  <div class="ob-shell">
    <div class="ob-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: var(--orange); font-weight: 700;">1 / 4 ステップ · オンボーディング</div>
        <a href="../02_dashboard/code.html" style="font-size: 12px; color: var(--neutral-500); text-decoration: none;">スキップ ✕</a>
      </div>

      <div style="background: linear-gradient(135deg, var(--orange-soft) 0%, var(--info-soft) 100%); border-radius: var(--r-md); padding: 48px; text-align: center; margin-bottom: 32px;">
        <div style="font-size: 96px; margin-bottom: 8px;">🎯</div>
        <div style="display: inline-flex; gap: 16px; padding: 16px 24px; background: var(--white); border-radius: var(--r-full); font-size: 13px;">
          <div>📚 情報処理技師</div>
          <div style="color: var(--neutral-300);">|</div>
          <div>⏱ 3時間/日</div>
          <div style="color: var(--neutral-300);">|</div>
          <div>🔥 14日連続</div>
        </div>
      </div>

      <h1 style="font-size: 28px; font-weight: 700; color: var(--neutral-900); margin-bottom: 12px; text-align: center;">目標を設定して学習を開始しましょう</h1>
      <p style="font-size: 14px; color: var(--neutral-500); line-height: 1.7; text-align: center; margin-bottom: 32px;">
        毎日目標を設定すると、学習データが自動的に記録され、<br>
        黒歴史のリスクレベルがリアルタイムで更新されます。目標未達成時にはペナルティが発動します。
      </p>

      <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 32px;">
        <span style="width: 24px; height: 8px; border-radius: 4px; background: var(--orange);"></span>
        <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--neutral-200);"></span>
        <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--neutral-200);"></span>
        <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--neutral-200);"></span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 32px;">
        <div style="text-align: center; padding: 12px; border: 1.5px solid var(--orange); background: var(--orange-soft); border-radius: var(--r-sm);">
          <div style="font-size: 28px; margin-bottom: 4px;">🎯</div>
          <div style="font-size: 11px; font-weight: 700; color: var(--orange);">目標・タイマー</div>
        </div>
        <div style="text-align: center; padding: 12px; border: 1px solid var(--neutral-200); border-radius: var(--r-sm);">
          <div style="font-size: 28px; margin-bottom: 4px; opacity: 0.4;">🔒</div>
          <div style="font-size: 11px; color: var(--neutral-500);">黒歴史システム</div>
        </div>
        <div style="text-align: center; padding: 12px; border: 1px solid var(--neutral-200); border-radius: var(--r-sm);">
          <div style="font-size: 28px; margin-bottom: 4px; opacity: 0.4;">🏆</div>
          <div style="font-size: 11px; color: var(--neutral-500);">コミュニティ・殿堂</div>
        </div>
        <div style="text-align: center; padding: 12px; border: 1px solid var(--neutral-200); border-radius: var(--r-sm);">
          <div style="font-size: 28px; margin-bottom: 4px; opacity: 0.4;">🛒</div>
          <div style="font-size: 11px; color: var(--neutral-500);">報酬・ショップ</div>
        </div>
      </div>

      <div style="display: flex; gap: 12px;">
        <a href="../02_dashboard/code.html" style="flex: 0 0 140px; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: var(--r-md); background: var(--white); color: var(--neutral-500); border: 1.5px solid var(--neutral-200); font-weight: 600; font-size: 13px; text-decoration: none;">スキップ</a>
        <a href="../02_dashboard/code.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: var(--r-md); background: var(--orange); color: var(--white); font-weight: 700; font-size: 14px; text-decoration: none;">次へ →</a>
      </div>
    </div>
  </div>

  <div class="screen-id">P-FE-SU-40 · /onboarding</div>
</div>
</body></html>
