<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A365D"/>
      <stop offset="100%" stop-color="#0F2447"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7B33"/>
      <stop offset="100%" stop-color="#FF5C00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1A365D" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 배경 데코 원형 -->
  <circle cx="80" cy="80" r="60" fill="#FFF7ED" opacity="0.7"/>
  <circle cx="475" cy="330" r="70" fill="#E0EAFF" opacity="0.5"/>
  <circle cx="70" cy="340" r="35" fill="#FFE4D1" opacity="0.6"/>
  <circle cx="500" cy="80" r="22" fill="#FFD3B6" opacity="0.8"/>

  <!-- 떠다니는 작은 도형들 -->
  <circle cx="120" cy="200" r="6" fill="#FF5C00"/>
  <circle cx="450" cy="190" r="4" fill="#1A365D"/>
  <circle cx="490" cy="240" r="3" fill="#FF5C00" opacity="0.6"/>
  <rect x="430" y="60" width="10" height="10" rx="2" fill="#FF5C00" opacity="0.7" transform="rotate(45 435 65)"/>
  <rect x="50" y="280" width="8" height="8" rx="2" fill="#1A365D" opacity="0.5" transform="rotate(30 54 284)"/>

  <!-- 별 모티프 (좌상단) -->
  <g transform="translate(140, 70)" fill="#FF5C00">
    <path d="M 10 0 L 12 7 L 20 7 L 13 12 L 16 20 L 10 15 L 4 20 L 7 12 L 0 7 L 8 7 Z"/>
  </g>
  <g transform="translate(420, 320)" fill="#FF5C00" opacity="0.6">
    <path d="M 8 0 L 10 6 L 16 6 L 11 10 L 13 16 L 8 12 L 3 16 L 5 10 L 0 6 L 6 6 Z"/>
  </g>

  <!-- 중앙: 큰 노트북 (학습) -->
  <g transform="translate(140, 175)" filter="url(#shadow)">
    <!-- 노트북 하단부 -->
    <rect x="0" y="160" width="280" height="14" rx="3" fill="#0F2447"/>
    <rect x="120" y="166" width="40" height="3" rx="1" fill="#1A365D"/>
    <!-- 노트북 화면 외곽 -->
    <rect x="20" y="0" width="240" height="165" rx="8" fill="url(#navyGrad)"/>
    <!-- 화면 내부 -->
    <rect x="32" y="12" width="216" height="141" rx="4" fill="#FFFFFF"/>

    <!-- 화면 안 콘텐츠 -->
    <!-- 헤더 바 -->
    <rect x="42" y="22" width="60" height="6" rx="3" fill="#1A365D"/>
    <circle cx="232" cy="25" r="3" fill="#10B981"/>
    <circle cx="222" cy="25" r="3" fill="#FF5C00"/>
    <circle cx="212" cy="25" r="3" fill="#E4E7EE"/>

    <!-- 학습 진행 바 -->
    <rect x="42" y="48" width="85" height="6" rx="3" fill="#F1F3F9"/>
    <text x="42" y="68" font-family="Arial" font-size="9" font-weight="700" fill="#1A365D">학습 진행</text>
    <rect x="42" y="74" width="166" height="10" rx="5" fill="#F1F3F9"/>
    <rect x="42" y="74" width="120" height="10" rx="5" fill="url(#orangeGrad)"/>
    <text x="42" y="100" font-family="Arial" font-size="9" font-weight="700" fill="#FF5C00">72%</text>

    <!-- XP 표시 -->
    <text x="105" y="100" font-family="Arial" font-size="9" font-weight="700" fill="#1A365D">XP 1,850</text>

    <!-- 데이터 라인 (학습 통계 미니 차트) -->
    <polyline points="42,135 65,125 88,130 111,115 134,118 157,108 180,112 203,100" stroke="#1A365D" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <circle cx="203" cy="100" r="3" fill="#FF5C00"/>
  </g>

  <!-- 우상단 자물쇠 (Vault 메타포) -->
  <g transform="translate(390, 80)" filter="url(#shadow)">
    <!-- 자물쇠 고리 -->
    <path d="M 18 35 Q 18 8 40 8 Q 62 8 62 35" stroke="#FF5C00" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- 자물쇠 몸체 -->
    <rect x="0" y="32" width="80" height="74" rx="10" fill="url(#orangeGrad)"/>
    <!-- 키홀 -->
    <circle cx="40" cy="62" r="7" fill="#FFFFFF"/>
    <rect x="36" y="65" width="8" height="18" rx="1" fill="#FFFFFF"/>
    <!-- 라벨 -->
    <rect x="-2" y="115" width="84" height="20" rx="10" fill="#1A365D"/>
    <text x="40" y="129" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700" fill="#FF5C00" letter-spacing="1">봉인소</text>
  </g>

  <!-- 우하단 LEVEL UP 게이지 -->
  <g transform="translate(380, 280)" filter="url(#shadow)">
    <rect x="0" y="0" width="150" height="56" rx="12" fill="url(#navyGrad)"/>
    <!-- 라벨 -->
    <text x="14" y="20" font-family="Arial" font-size="9" font-weight="700" fill="#FF5C00" letter-spacing="2">LEVEL UP</text>
    <!-- 게이지 트랙 -->
    <rect x="14" y="26" width="122" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
    <rect x="14" y="26" width="92" height="8" rx="4" fill="url(#orangeGrad)"/>
    <!-- 레벨 정보 -->
    <text x="14" y="50" font-family="Arial" font-size="9" font-weight="700" fill="#FFFFFF">Lv. 12</text>
    <text x="136" y="50" text-anchor="end" font-family="Arial" font-size="9" font-weight="500" fill="#86A0CD">1850 / 2300</text>
    <!-- 위로 오르는 화살표 -->
    <g transform="translate(120, 10)">
      <path d="M 10 0 L 18 8 L 12 8 L 12 16 L 8 16 L 8 8 L 2 8 Z" fill="#10B981"/>
    </g>
  </g>

  <!-- 좌하단 책 스택 -->
  <g transform="translate(60, 260)" filter="url(#shadow)">
    <!-- 첫 번째 책 (가장 큰) -->
    <rect x="0" y="50" width="80" height="22" rx="3" fill="url(#orangeGrad)"/>
    <rect x="8" y="56" width="40" height="3" rx="1" fill="#FFFFFF" opacity="0.6"/>
    <rect x="8" y="62" width="30" height="3" rx="1" fill="#FFFFFF" opacity="0.6"/>
    <!-- 두 번째 책 -->
    <rect x="6" y="28" width="68" height="22" rx="3" fill="#1A365D"/>
    <rect x="14" y="34" width="35" height="3" rx="1" fill="#FFFFFF" opacity="0.4"/>
    <rect x="14" y="40" width="28" height="3" rx="1" fill="#FFFFFF" opacity="0.4"/>
    <!-- 세 번째 책 -->
    <rect x="12" y="6" width="56" height="22" rx="3" fill="#86A0CD"/>
    <rect x="20" y="12" width="32" height="3" rx="1" fill="#FFFFFF" opacity="0.6"/>
    <rect x="20" y="18" width="22" height="3" rx="1" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- 좌측 위 체크 표시 (목표 달성 메타포) -->
  <g transform="translate(200, 95)" filter="url(#shadow)">
    <circle cx="14" cy="14" r="14" fill="#10B981"/>
    <path d="M 7 14 L 12 19 L 21 9" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 우측 위 시계/타이머 -->
  <g transform="translate(310, 100)" filter="url(#shadow)">
    <circle cx="18" cy="18" r="18" fill="#FFFFFF" stroke="#1A365D" stroke-width="2.5"/>
    <line x1="18" y1="6" x2="18" y2="18" stroke="#FF5C00" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="18" x2="26" y2="22" stroke="#1A365D" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="18" cy="18" r="2" fill="#1A365D"/>
  </g>

  <!-- 점선 연결 (학습 흐름) -->
  <path d="M 230 130 Q 280 90 320 110" stroke="#FF5C00" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.5"/>
</svg>
